---
 - name: q4 install pacage
   hosts: dev prod balancer
   become: true
   tasks:
     - name: install package
       ansible.builtin.yum:
          name: 
            - mariadb
            - php
          state: present
       when: ( inventory_hostname in groups['dev'] or inventory_hostname in groups ['prod'] or inventory_hostname in groups['balancer'])
     - name: install group package 
       ansible.builtin.yum:
          name: "@RPM Development Tools"
          state: present
       when: inventory_hostname in groups['dev']
     - name: all pacakge update
       ansible.builtin.yum:
           name: "*"
           state: latest
       when: inventory_hostname in groups['dev']      
